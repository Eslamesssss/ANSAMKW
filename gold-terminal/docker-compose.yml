# GOLD INTELLIGENCE TERMINAL V1
#   cp .env.example .env        # set ADMIN_API_TOKEN (and ANTHROPIC_API_KEY for the analyst); Binance needs no key
#   docker compose up --build
# Web: http://localhost:3000   API: http://localhost:4000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gold
      POSTGRES_PASSWORD: gold
      POSTGRES_DB: gold
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gold -d gold"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Not published on the host, so it cannot clash with another local PostgreSQL.

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://gold:gold@db:5432/gold
      FIXTURE_DIR: ../../fixtures/synthetic
      PORT: "4000"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:4000}
    depends_on:
      - server
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pgdata:
