name: Gold Intelligence Terminal

on:
  push:
    paths: ["gold-terminal/**", ".github/workflows/gold-terminal.yml"]
  pull_request:
    paths: ["gold-terminal/**", ".github/workflows/gold-terminal.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gold-terminal
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gold
          POSTGRES_PASSWORD: gold
          POSTGRES_DB: gold_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gold -d gold_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://gold:gold@localhost:5432/gold_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gold-terminal/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
